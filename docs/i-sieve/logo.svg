<svg width="760" height="260" viewBox="0 0 760 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7FD5FF"/>
      <stop offset="100%" stop-color="#1BA7F2"/>
    </linearGradient>
    <linearGradient id="blueSide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B2E5A"/>
      <stop offset="100%" stop-color="#082243"/>
    </linearGradient>
    <linearGradient id="gridStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E2ECF8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#AFC2D9" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="dotBlue" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0%" stop-color="#BEE7FF"/>
      <stop offset="100%" stop-color="#1185CC"/>
    </radialGradient>
    <linearGradient id="sieveAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6FFFEA" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#2BC8FF" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- perspective grid base -->
  <g transform="translate(82 38)">
    <path d="M0 64 L520 34 L640 90 L120 122 Z" stroke="url(#gridStroke)" stroke-width="2.2" fill="none"/>
    <line x1="26" y1="66" x2="546" y2="36" stroke="#D7E3F2" stroke-opacity="0.9"/>
    <line x1="52" y1="68" x2="572" y2="38" stroke="#D7E3F2" stroke-opacity="0.86"/>
    <line x1="78" y1="70" x2="598" y2="40" stroke="#D7E3F2" stroke-opacity="0.82"/>
    <line x1="104" y1="72" x2="624" y2="42" stroke="#D7E3F2" stroke-opacity="0.78"/>

    <line x1="118" y1="52" x2="238" y2="108" stroke="#C4D3E6" stroke-opacity="0.86"/>
    <line x1="156" y1="49" x2="276" y2="105" stroke="#C4D3E6" stroke-opacity="0.86"/>
    <line x1="194" y1="47" x2="314" y2="103" stroke="#C4D3E6" stroke-opacity="0.86"/>
    <line x1="232" y1="45" x2="352" y2="101" stroke="#C4D3E6" stroke-opacity="0.86"/>
    <line x1="270" y1="43" x2="390" y2="99" stroke="#C4D3E6" stroke-opacity="0.86"/>
    <line x1="308" y1="41" x2="428" y2="97" stroke="#C4D3E6" stroke-opacity="0.86"/>
    <line x1="346" y1="39" x2="466" y2="95" stroke="#C4D3E6" stroke-opacity="0.86"/>
    <line x1="384" y1="37" x2="504" y2="93" stroke="#C4D3E6" stroke-opacity="0.86"/>
    <line x1="422" y1="35" x2="542" y2="91" stroke="#C4D3E6" stroke-opacity="0.86"/>

    <!-- sieve icon highlight frame -->
    <polygon points="198,45 298,40 360,68 260,74" fill="#07162A" fill-opacity="0.25" stroke="url(#sieveAccent)" stroke-width="2.4"/>
    <line x1="214" y1="48" x2="314" y2="43" stroke="#7EEAFD" stroke-opacity="0.9" stroke-width="1.3"/>
    <line x1="228" y1="54" x2="328" y2="49" stroke="#7EEAFD" stroke-opacity="0.82" stroke-width="1.2"/>
    <line x1="242" y1="60" x2="342" y2="55" stroke="#7EEAFD" stroke-opacity="0.76" stroke-width="1.1"/>
    <line x1="224" y1="46" x2="286" y2="71" stroke="#7EEAFD" stroke-opacity="0.65" stroke-width="1.1"/>
    <line x1="252" y1="45" x2="314" y2="70" stroke="#7EEAFD" stroke-opacity="0.65" stroke-width="1.1"/>
    <line x1="280" y1="44" x2="342" y2="69" stroke="#7EEAFD" stroke-opacity="0.65" stroke-width="1.1"/>
  </g>

  <!-- 3D wordmark -->
  <g font-family="Inter, Arial, Helvetica, sans-serif" font-size="126" font-weight="700" letter-spacing="-2">
    <!-- extrusion/back -->
    <text x="128" y="170" fill="url(#blueSide)" opacity="1">i•sieve</text>
    <text x="122" y="164" fill="url(#blueFront)">i•sieve</text>
  </g>

  <!-- glossy dots above i and i -->
  <circle cx="144" cy="74" r="19" fill="url(#dotBlue)"/>
  <circle cx="144" cy="69" r="7.5" fill="#D8EDFF" fill-opacity="0.6"/>
  <circle cx="392" cy="86" r="14.5" fill="url(#dotBlue)"/>
  <circle cx="392" cy="82" r="5.6" fill="#D8EDFF" fill-opacity="0.58"/>
